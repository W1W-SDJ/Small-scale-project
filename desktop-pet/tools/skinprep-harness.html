<!doctype html>
<html>
  <head><meta charset="utf-8" /></head>
  <body>
    <!-- Harness page for tools/test-skinprep.cjs: runs the panel's sprite
         preparation in a browser context, where canvas decoding exists. -->
    <script src="../skinprep.js"></script>
    <script>
      window.prepare = async function (dataUrl) {
        const img = new Image()
        img.src = dataUrl
        await img.decode()
        const MAX = 900
        const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight))
        const w = Math.max(1, Math.round(img.naturalWidth * scale))
        const h = Math.max(1, Math.round(img.naturalHeight * scale))
        const canvas = document.createElement('canvas')
        canvas.width = w
        canvas.height = h
        const ctx = canvas.getContext('2d', { willReadFrequently: true })
        ctx.drawImage(img, 0, 0, w, h)
        let image = ctx.getImageData(0, 0, w, h)
        const coverageBefore = SkinPrep.alphaCoverage(image)
        // Exactly what the panel does with a dropped file.
        const prepared = SkinPrep.prepareSprite(image)
        image = prepared.image
        const out = document.createElement('canvas')
        out.width = image.width
        out.height = image.height
        out.getContext('2d').putImageData(image, 0, 0)
        const mask = SkinPrep.buildMask(image)
        let solid = 0
        for (let i = 0; i < mask.bytes.length * 8; i++) if (mask.bytes[i >> 3] & (1 << (7 - (i & 7)))) solid++
        return {
          dataUrl: out.toDataURL('image/png'),
          width: image.width,
          height: image.height,
          method: prepared.method,
          dropped: prepared.dropped,
          coverageBefore,
          coverageAfter: SkinPrep.alphaCoverage(image),
          solidRatio: solid / (mask.width * mask.height),
        }
      }
    </script>
  </body>
</html>
