name: Release

# NOTE: GitHub only reads workflows from the *repository root*
# `.github/workflows/`, and this repo keeps the project in `desktop-pet/`.
# This file is therefore published to `<repo root>/.github/workflows/release.yml`
# (a copy kept here next to the code it builds); a copy inside desktop-pet/ is
# inert — GitHub never looks there.
#
# Builds both Windows distributions of the pet and (on a tag) attaches them to the
# GitHub release:
#
#   BlobPet-<ver>-portable.exe   single file, double-click to run
#   BlobPet-<ver>-win64.zip      folder form, unzip + start-pet.cmd
#
# Why two: the single-file exe is an unsigned NSIS wrapper around our unsigned
# "Blob Pet.exe", and Windows 11 Smart App Control (enforcement mode) blocks it
# silently. The folder form ships Chromium's own signed electron.exe next to our
# app.asar, which runs without asking the user to change any security setting.
#
# The project lives in desktop-pet/, so every build step is scoped there.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop-pet

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-pet/package-lock.json

      # Reads package-lock.json, so an out-of-sync lockfile fails here loudly
      # instead of producing a build nobody can reproduce.
      - name: Install dependencies
        run: npm ci

      - name: Resolve version from the tag
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $Matches[1] } else { (Get-Content package.json -Raw | ConvertFrom-Json).version }
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $pkgVersion) {
            Write-Host "package.json says $pkgVersion, tag says $version - building as $version"
            npm version $version --no-git-tag-version --allow-same-version | Out-Null
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build single-file portable exe
        run: npx --yes electron-builder --win portable

      - name: Build folder form (Smart App Control safe)
        shell: pwsh
        run: |
          # `dir` target gives us resources/app.asar, but NOT the binary we want to
          # ship: electron-builder rewrites the icon/version resources of the exe,
          # which invalidates its Authenticode signature, and Smart App Control then
          # blocks it silently. So the folder form pairs our app.asar with an
          # untouched, still-signed official electron.exe.
          npx --yes electron-builder --win dir

          $version = '${{ steps.version.outputs.version }}'
          $electronVersion = (Get-Content node_modules/electron/package.json -Raw | ConvertFrom-Json).version
          $out = "dist/BlobPet-$version-win64"
          New-Item -ItemType Directory -Force $out | Out-Null

          # electron's own postinstall does not run in CI, so node_modules/electron/dist
          # is empty; take the official zip from electron-builder's cache if present,
          # otherwise fetch it once.
          $zipName = "electron-v$electronVersion-win32-x64.zip"
          $cacheRoot = Join-Path $env:LOCALAPPDATA 'electron\Cache'
          $zipPath = $null
          if (Test-Path $cacheRoot) {
            $zipPath = Get-ChildItem $cacheRoot -Recurse -Filter $zipName -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $zipPath) {
            $zipPath = Join-Path $env:RUNNER_TEMP $zipName
            $url = "https://github.com/electron/electron/releases/download/v$electronVersion/$zipName"
            Write-Host "downloading $url"
            curl.exe -L --fail --retry 3 --max-time 600 -o $zipPath $url
            if ($LASTEXITCODE -ne 0) { throw "electron download failed ($LASTEXITCODE)" }
          }
          Write-Host "using electron zip: $zipPath"

          tar.exe -xf $zipPath -C $out
          if ($LASTEXITCODE -ne 0) { Expand-Archive -Path $zipPath -DestinationPath $out -Force }

          # Electron's Windows binaries are NOT Authenticode-signed (verified:
          # Get-AuthenticodeSignature returns NotSigned for the official
          # electron.exe). What makes the folder form usable under Smart App Control
          # is that the file is byte-identical to the widely-seen official binary, so
          # it carries reputation. electron-builder's own copy is rewritten (icon and
          # version resources), which changes the hash and loses that reputation —
          # that is exactly why this form exists. Assert we ship it untouched.
          $electronHash = (Get-FileHash (Join-Path $out 'electron.exe') -Algorithm SHA256).Hash
          Write-Host "electron.exe sha256=$electronHash (unsigned; trusted by reputation)"

          Copy-Item dist/win-unpacked/resources/app.asar "$out/resources/app.asar" -Force
          Copy-Item start-pet.cmd $out -Force
          Copy-Item packaging/* $out -Force

          $afterCopy = (Get-FileHash (Join-Path $out 'electron.exe') -Algorithm SHA256).Hash
          if ($afterCopy -ne $electronHash) {
            throw "electron.exe changed after extraction ($electronHash -> $afterCopy); the folder form would lose its reputation"
          }

          & 'C:\Program Files\7-Zip\7z.exe' a -tzip -mx=7 -mm=Deflate "dist/BlobPet-$version-win64.zip" $out | Select-Object -Last 3
          if ($LASTEXITCODE -ne 0) { throw "7z failed with $LASTEXITCODE" }
          Get-Item "dist/BlobPet-$version-win64.zip" | Select-Object Name, @{n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -match '^BlobPet-.*\.(exe|zip)$' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlobPet-${{ steps.version.outputs.version }}
          path: |
            desktop-pet/dist/BlobPet-*.exe
            desktop-pet/dist/BlobPet-*.zip
            desktop-pet/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-pet/dist/BlobPet-*.exe
            desktop-pet/dist/BlobPet-*.zip
            desktop-pet/dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
